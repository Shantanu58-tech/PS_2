services:
  deepastambha:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # The backend resolves relative paths against the repo root, which is "/"
    # inside the container (app lives in /app), so these mounts line up with the
    # local layout: data/, models/, replay/.
    volumes:
      - ./data:/data
      - ./models:/models
      - ./replay:/replay
      - ./.env:/app/.env:ro
    environment:
      - MODE=replay
    restart: unless-stopped
