<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEEPASTAMBHA · Narrative Watch</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@500&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <!-- boot splash: shown until the app renders (and while a sleeping server wakes up) -->
  <div id="boot" style="position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(900px 500px at 50% 40%,#4a3a30,#1c140e);color:#E8DFD5;font:600 14px Inter,system-ui,sans-serif;transition:opacity .45s">
    <style>
      #boot .fl{transform-origin:32px 19px;animation:bf 1.1s ease-in-out infinite}
      #boot .glow{animation:bg 2.2s ease-in-out infinite}
      #boot .bar{width:180px;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;position:relative;margin:18px auto 10px}
      #boot .bar i{position:absolute;inset:0;width:40%;background:#C87D43;border-radius:3px;animation:bs 1.2s ease-in-out infinite}
      @keyframes bf{0%,100%{transform:scale(1,1)}35%{transform:scale(.93,1.09)}70%{transform:scale(1.05,.95)}}
      @keyframes bg{0%,100%{opacity:.35}50%{opacity:.8}}
      @keyframes bs{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
      @media (prefers-reduced-motion:reduce){#boot *{animation:none!important}}
    </style>
    <div style="text-align:center">
      <svg width="96" height="96" viewBox="0 0 64 64" aria-hidden="true">
        <circle class="glow" cx="32" cy="13" r="11" fill="#FF9933" opacity=".4"/>
        <circle cx="32" cy="32" r="30" fill="none" stroke="#C87D43" stroke-width="2"/>
        <path class="fl" d="M32 6.2 C35.9 10.8 36.3 14.1 34.5 16.8 C33.7 18 32.8 18.6 32 18.8 C31.2 18.6 30.3 18 29.5 16.8 C27.7 14.1 28.1 10.8 32 6.2 Z" fill="#FF9933"/>
        <polygon points="28.2,50 35.8,50 34.2,21.4 29.8,21.4" fill="#E8DFD5"/>
        <g stroke="#E8DFD5" stroke-width="2.3" stroke-linecap="round"><line x1="22" y1="44" x2="42" y2="44"/><line x1="24" y1="36.5" x2="40" y2="36.5"/><line x1="26" y1="29" x2="38" y2="29"/></g>
        <g fill="#FF9933"><circle cx="22" cy="41.7" r="2.1"/><circle cx="42" cy="41.7" r="2.1"/><circle cx="24" cy="34.2" r="2.1"/><circle cx="40" cy="34.2" r="2.1"/><circle cx="26" cy="26.7" r="2.1"/><circle cx="38" cy="26.7" r="2.1"/></g>
        <rect x="22" y="50" width="20" height="3.6" rx=".8" fill="#E8DFD5"/>
      </svg>
      <div style="font:800 22px Inter,system-ui,sans-serif;letter-spacing:.1em;margin-top:10px">DEEPASTAMBHA</div>
      <div class="bar"><i></i></div>
      <div style="opacity:.75;font-weight:500">Lighting the lamps…</div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
