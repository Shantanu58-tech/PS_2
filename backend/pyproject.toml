[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepastambha-backend"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "cryptography>=42",
    "imagehash>=4.3",
    "Pillow>=10",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
    "transformers>=4.41",
    "torch>=2.3",
    "numpy>=1.26",
    "scipy>=1.13",
    # scikit-learn 1.9 and pandas 3.x native DLLs are blocked by Windows Smart App
    # Control on the dev machine (ADR 0004 / docs/DECISIONS.md); Linux is unaffected.
    "scikit-learn>=1.5,<1.7",
    "pandas>=2.1,<3",
    "networkx>=3.3",
    "bertopic>=0.16",
    "umap-learn>=0.5",
    "hdbscan>=0.8",
    "jinja2>=3.1",
    "weasyprint>=62",
    "langdetect>=1.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "pytesseract>=0.3",
    "opencv-python-headless>=4.9",
    "twscrape>=0.12",
    "telethon>=1.36",
    "praw>=7.7",
    "google-api-python-client>=2.130",
    "requests>=2.31",
    "huggingface_hub>=0.23",
    "sentencepiece>=0.2",
    "google-genai>=1.0",
    "opentimestamps-client>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff==0.12.0",
    "mypy>=1.10",
]
neo4j = ["neo4j>=5.20"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scenario*", "eval*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
